# Mirrors docs/specs and docs/records to Linear documents (SEED-R12).
# Pushes to main write; pull requests run a dry run and print the plan.
# Needs the LINEAR_API_KEY repository secret (SEED T11, LIN-11).
name: linear-sync

on:
  push:
    branches: [main]
    paths: ["docs/specs/**", "docs/records/**"]
  pull_request:
    paths:
      - "docs/specs/**"
      - "docs/records/**"
      - "tools/specs/**"
      - ".github/workflows/linear-sync.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linear-sync-${{ github.ref }}

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Install pnpm from packageManager through corepack (SEED-R2)
        run: npm i -g corepack@0.36.0 && corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Mirror specs and records to Linear (SEED-R10, SEED-R11, SEED-R12)
        if: github.event_name != 'pull_request'
        run: pnpm linear:sync
      - name: Plan the mirror without writing (SEED-R12, SEED-R13)
        if: github.event_name == 'pull_request'
        run: pnpm linear:sync --dry-run

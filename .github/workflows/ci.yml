# CI for every pull request and every push to main (SEED-R25).
# Step names cite the requirement ids they enforce.
name: ci

on:
  pull_request:
    # `edited` re-runs only the title check when a pull request is retitled.
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # A new push to a pull request cancels its superseded run. Title edits get their own
  # group so they never cancel a build. Pushes to main each run to completion.
  group: >-
    ${{ github.workflow }}-${{ github.event_name == 'pull_request'
    && format('pr-{0}-{1}', github.event.pull_request.number, github.event.action == 'edited' && 'title' || 'build')
    || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  title:
    name: Pull-request title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Conventional Commits title (SEED-R16)
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test)(\([a-z0-9][a-z0-9._/-]*\))?!?: [^ ].*$'
          if [[ "$TITLE" =~ $pattern ]]; then
            echo "Title ok: $TITLE"
          else
            echo "::error::Pull-request title must follow Conventional Commits, type(scope)!: subject. Got: $TITLE"
            exit 1
          fi

  build:
    name: Build and test
    if: github.event_name != 'pull_request' || github.event.action != 'edited'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Node from .nvmrc (SEED-R2)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: pnpm from packageManager (SEED-R2)
        # Node 26 no longer bundles corepack.
        run: |
          npm install --global corepack@0.36.0
          corepack enable
          pnpm --version
          echo "PNPM_STORE=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.PNPM_STORE }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Install (SEED-R1)
        run: pnpm install --frozen-lockfile

      - name: Lint (SEED-R3)
        run: pnpm lint

      - name: Typecheck (SEED-R4)
        run: pnpm typecheck

      - name: Unit tests (SEED-R25)
        run: pnpm test

      - name: Spec checks (SEED-R8, SEED-R9, SEED-R30)
        run: pnpm check:specs

      - name: Build (SEED-R21, SEED-R25)
        env:
          APP_VERSION: ci
          APP_COMMIT: ${{ github.sha }}
        run: pnpm build

      - name: Install Playwright Chromium (SEED-R25)
        run: pnpm --filter @sesv/web exec playwright install --with-deps chromium

      - name: End-to-end tests against the built server (SEED-R17, SEED-R20, SEED-R25)
        run: pnpm test:e2e

      - name: Docker build (SEED-R23)
        env:
          APP_COMMIT: ${{ github.sha }}
        run: >-
          docker build
          --build-arg APP_VERSION=ci
          --build-arg APP_COMMIT="$APP_COMMIT"
          --tag linear-web:ci
          .

      - name: Container smoke (SEED-R23, SEED-R24)
        env:
          EXPECTED_VERSION: ci
          EXPECTED_COMMIT: ${{ github.sha }}
        run: pnpm smoke:container linear-web:ci

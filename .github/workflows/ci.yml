# CI for every pull request and every push to main (SEED-R25).
# Step names cite the requirement ids they enforce.
name: ci

on:
  pull_request:
    # `edited` re-runs only the title check when a pull request is retitled.
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # A new push to a pull request cancels its superseded run. Title edits get their own
  # group so they never cancel a build. Pushes to main each run to completion.
  group: >-
    ${{ github.workflow }}-${{ github.event_name == 'pull_request'
    && format('pr-{0}-{1}', github.event.pull_request.number, github.event.action == 'edited' && 'title' || 'build')
    || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  title:
    name: Pull-request title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Conventional Commits title (SEED-R16)
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test)(\([a-z0-9][a-z0-9._/-]*\))?!?: [^ ].*$'
          if [[ "$TITLE" =~ $pattern ]]; then
            echo "Title ok: $TITLE"
          else
            echo "::error::Pull-request title must follow Conventional Commits, type(scope)!: subject. Got: $TITLE"
            exit 1
          fi

  build:
    name: Build and test
    if: github.event_name != 'pull_request' || github.event.action != 'edited'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Node and pnpm from mise.toml, then install (SEED-R1, SEED-R2)
        uses: ./.github/actions/setup

      # Started from compose.yaml rather than as a job service: services cannot pass
      # `-c wal_level=logical`, and one file keeps CI and local runs on the same Postgres.
      # Unit and end-to-end tests fall back to its URL (apps/web/src/server/db/local.ts).
      - name: Database service from compose.yaml with logical replication (MIRROR-R8)
        run: |
          docker compose up --detach --wait postgres
          wal_level=$(docker compose exec -T postgres psql -U linear -d linear -tAc 'show wal_level')
          [[ $wal_level == logical ]] || { echo "::error::wal_level is '$wal_level', want logical"; exit 1; }

      - name: Lint (SEED-R3)
        run: pnpm lint

      - name: Typecheck (SEED-R4)
        run: pnpm typecheck

      # Includes apps/web/test/grid-boundary.test.ts, which fails when any module but the
      # grid adapter imports the grid library (REC-004).
      - name: Unit tests against the database service, and the single grid importer check (SEED-R25, MIRROR-R8, MIRROR-R22)
        run: pnpm test

      - name: Spec checks (SEED-R8, SEED-R9, SEED-R30)
        run: pnpm check:specs

      - name: Build (SEED-R21, SEED-R25)
        env:
          APP_VERSION: ci
          APP_COMMIT: ${{ github.sha }}
        run: pnpm build

      - name: Install Playwright Chromium (SEED-R25)
        run: pnpm --filter @sesv/web exec playwright install --with-deps chromium

      - name: End-to-end tests against the built server and the database service (SEED-R20, SEED-R25, MIRROR-R5, MIRROR-R6, MIRROR-R8)
        run: pnpm test:e2e

      - name: Docker build (SEED-R23)
        env:
          APP_COMMIT: ${{ github.sha }}
        run: >-
          docker build
          --build-arg APP_VERSION=ci
          --build-arg APP_COMMIT="$APP_COMMIT"
          --tag linear-web:ci
          .

      - name: Container smoke with migrate and scheduler against a throwaway database (SEED-R23, SEED-R24, MIRROR-R30)
        env:
          EXPECTED_VERSION: ci
          EXPECTED_COMMIT: ${{ github.sha }}
        run: pnpm smoke:container linear-web:ci

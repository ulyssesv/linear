# Node and pnpm for this repository (SEED-R2). `mise install` installs them, verified
# against the checksums in mise.lock; `mise lock` refreshes that file after a bump.
# Bump node together with the Dockerfile's NODE_IMAGE and `engines` in package.json, and
# pnpm together with `packageManager` (pnpm switches itself to that version regardless).
min_version = "2026.9.16"

[tools]
node = "26.13.0"
pnpm = "12.16.1"

# Local secrets for `pnpm dev`, the CLI commands and the tools: one `.env` at the root of
# the main checkout, read from every worktree through git's common directory, wherever the
# worktree lives. A missing file is skipped, so CI and fresh clones run without one; outside
# a git checkout the path falls back to `./.env`. `.env.example` lists the names.
[env]
_.file = { path = "{{ exec(command='dirname \"$(git rev-parse --path-format=absolute --git-common-dir 2>/dev/null || echo ./.git)\"') }}/.env", redact = true }

[settings]
lockfile = true
